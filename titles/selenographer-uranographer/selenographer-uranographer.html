/* ======================================================================
   Helpers
   ====================================================================== */
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("en-US");
const fmtLat = d => `${Math.abs(d).toFixed(2)}° ${d >= 0 ? "N" : "S"}`;
const fmtLon = d => `${Math.abs(d).toFixed(2)}° ${d >= 0 ? "E" : "W"}`;
const fmtRA = deg => { const h = ((deg % 360) + 360) % 360 / 15; let hh = Math.floor(h), mm = Math.round((h - hh) * 60); if (mm === 60) { hh = (hh + 1) % 24; mm = 0; } return `${hh}h ${String(mm).padStart(2, "0")}m`; };
const fmtDec = d => `${d >= 0 ? "+" : "−"}${Math.abs(d).toFixed(1)}°`;
const vec = (lat, lon, r = 1) => {
  const p = lat * D2R, l = lon * D2R;
  return new THREE.Vector3(r * Math.cos(p) * Math.cos(l), r * Math.sin(p), -r * Math.cos(p) * Math.sin(l));
};
const toLatLon = v => { const n = v.clone().normalize(); return { lat: Math.asin(Math.max(-1, Math.min(1, n.y))) / D2R, lon: Math.atan2(-n.z, n.x) / D2R }; };
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const ordinal = n => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const wrap180 = d => { d = ((d + 180) % 360 + 360) % 360 - 180; return d; };

const srcList = f => `<ol class="src">${(SOURCES[f.name] || []).map(([t, u]) => `<li><a href="${u}" target="_blank" rel="noopener">${t}</a></li>`).join("")}</ol>`;
const moonFull = f => f.site ? 10 : f.linear ? Math.min(f.size / 4, 100) : Math.min(f.size / 2, 300);
const moonSize = f => f.site ? "Landing site" : f.linear ? `${fmt(f.size)} km long` : `${fmt(f.size)} km across`;

/* ======================================================================
   Renderer + shared overlay helpers
   ====================================================================== */
const stage = $("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.setClearColor(0x0a0c13, 1);
stage.appendChild(renderer.domElement);
const canvas = renderer.domElement;
let W = 1, H = 1;

const lineOf = (pts, color, opacity, dashed) => {
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const m = dashed ? new THREE.LineDashedMaterial({ color, dashSize: dashed, gapSize: dashed * 0.6, transparent: true, opacity }) : new THREE.LineBasicMaterial({ color, transparent: true, opacity });
  const l = new THREE.Line(g, m);
  if (dashed) l.computeLineDistances();
  return l;
};
const slerpArc = (a, b, r, lift) => {
  const va = a.clone().normalize(), vb = b.clone().normalize();
  const ang = va.angleTo(vb), n = Math.max(8, Math.ceil(ang / D2R)), pts = [], s = Math.sin(ang) || 1;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const p = va.clone().multiplyScalar(Math.sin((1 - t) * ang) / s).add(vb.clone().multiplyScalar(Math.sin(t * ang) / s)).normalize();
    pts.push(p.multiplyScalar(r * (1 + (lift ? Math.sin(t * Math.PI) * Math.min(ang, 1) * lift : 0))));
  }
  return pts;
};
const circleOn = (center, ang, r) => {
  const c = center.clone().normalize();
  const u = new THREE.Vector3().crossVectors(c, Math.abs(c.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0)).normalize();
  const w = new THREE.Vector3().crossVectors(c, u), pts = [];
  for (let i = 0; i <= 96; i++) {
    const t = i / 96 * Math.PI * 2;
    pts.push(c.clone().multiplyScalar(Math.cos(ang)).add(u.clone().multiplyScalar(Math.cos(t) * Math.sin(ang))).add(w.clone().multiplyScalar(Math.sin(t) * Math.sin(ang))).multiplyScalar(r));
  }
  return pts;
};
const dot = color => new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), new THREE.MeshBasicMaterial({ color }));
const panelBox = () => {
  if ($("notes").hidden) return { x: 0, y: 0 };
  return innerWidth > 760 ? { x: 420, y: 0 } : { x: 0, y: Math.round(H * 0.56) };
};

/* ======================================================================
   MOON MODE
   ====================================================================== */
const moonM = (() => {
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(36, 1, 0.01, 200);
  scene.add(camera);
  scene.add(new THREE.AmbientLight(0xffffff, 0.32));
  const sun = new THREE.DirectionalLight(0xfff6e8, 0.95);
  sun.position.set(-1.2, 0.9, 2.2); camera.add(sun);
  const body = new THREE.Group(); body.rotation.order = "XYZ"; scene.add(body);
  const globe = new THREE.Mesh(new THREE.SphereGeometry(1, 160, 96), new THREE.MeshPhongMaterial({ color: 0xffffff, shininess: 0 }));
  body.add(globe);
  // background stars (decorative)
  { const n = 1400, pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { const v = new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize().multiplyScalar(60 + Math.random() * 30); pos.set([v.x, v.y, v.z], i * 3); }
    const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xbfc4d6, size: 1.4, sizeAttenuation: false, transparent: true, opacity: 0.7 }))); }
  const grid = new THREE.Group(); grid.visible = false; body.add(grid);
  for (let lat = -60; lat <= 60; lat += 30) { const p = []; for (let lon = -180; lon <= 180; lon += 3) p.push(vec(lat, lon, 1.002)); grid.add(lineOf(p, 0x86cdf5, lat ? 0.22 : 0.45)); }
  for (let lon = -180; lon < 180; lon += 30) { const p = []; for (let lat = -90; lat <= 90; lat += 3) p.push(vec(lat, lon, 1.002)); grid.add(lineOf(p, 0x86cdf5, lon ? 0.22 : 0.45)); }
  const marks = new THREE.Group(); body.add(marks);
  const pin = dot(0x86cdf5), ans = dot(0xe6b968); pin.visible = ans.visible = false; body.add(pin, ans);

  const view = { yaw: -Math.PI / 2, pitch: 0, dist: 3, offX: 0, offY: 0 };
  const fit = () => {
    const p = panelBox(), aw = W - p.x, ah = H - p.y, tv = Math.tan(camera.fov * D2R / 2);
    const half = Math.atan(Math.min(tv * ah / H, tv * aw / H));
    return 1.1 / Math.sin(half * (innerWidth <= 760 && !p.y ? 0.82 : 1));
  };
  const faceOf = v => { const { lat, lon } = toLatLon(v); return { yaw: -Math.PI / 2 - lon * D2R, pitch: lat * D2R }; };
  let label = null;

  return {
    id: "moon", scene, camera, view, ready: false, pool: MOON, grid,
    brand: "Selenographer", unit: "Plate", legend: "the feature",
    help: "Drag to turn the Moon, scroll or pinch to zoom. Click the surface to drop your pin, then lock it in.",
    home: () => ({ yaw: -Math.PI / 2, pitch: 0, dist: fit(), offX: 0, offY: 0 }),
    far: () => ({ yaw: Math.PI / 2, pitch: 0, dist: fit() }),
    apply(now, state) {
      body.rotation.set(view.pitch, view.yaw, 0);
      camera.position.set(0, 0, view.dist); camera.lookAt(0, 0, 0);
      if (view.offX || view.offY) camera.setViewOffset(W, H, view.offX, view.offY, W, H); else camera.clearViewOffset();
      const s = Math.max(0.14, (view.dist - 1) / 2) * 0.014;
      pin.scale.setScalar(s); ans.scale.setScalar(s * (1 + (state === "revealed" && !reduced ? 0.25 * Math.sin(now / 260) : 0)));
    },
    drag(dx, dy) {
      const k = (view.dist - 1) * 1.7 / H;
      view.yaw += dx * k; view.pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, view.pitch + dy * k));
    },
    zoom(f) { view.dist = Math.max(1.12, Math.min(fit() * 1.6, 1 + (view.dist - 1) * f)); },
    arrow(dx, dy) { const k = 0.12 * (view.dist - 1) / 2; view.yaw += dx * k; view.pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, view.pitch + dy * k)); },
    pick(ray) { const hit = ray.intersectObject(globe)[0]; return hit ? body.worldToLocal(hit.point.clone()).normalize() : null; },
    readout(v, tag) { const { lat, lon } = toLatLon(v); return `${tag} <span>${fmtLat(lat)} · ${fmtLon(lon)}</span>`; },
    setPin(v) { if (!v) { pin.visible = false; return; } pin.position.copy(v.clone().multiplyScalar(1.004)); pin.visible = true; },
    clear() { pin.visible = ans.visible = false; while (marks.children.length) marks.children.pop().geometry.dispose(); },
    chips(f) {
      const c = [f.kind, moonSize(f)].filter((x, i, a) => a.indexOf(x) === i).map(x => `<span class="chip">${x}</span>`);
      if (f.far) c.push(`<span class="chip far">Far side</span>`);
      if (f.polar) c.push(`<span class="chip far">Polar</span>`);
      return c.join("");
    },
    score(f, gv) {
      const tv = vec(f.lat, f.lon), ang = gv.angleTo(tv), d = ang * R_KM, r = moonFull(f);
      const pts = d <= r ? MAX : Math.round(MAX * Math.exp(-(d - r) / 600));
      const text = d <= r ? (f.site ? `${fmt(Math.round(d))} km from the site` : `Inside the ${f.kind.toLowerCase()}, ${fmt(Math.round(d))} km from its center`) : `${fmt(Math.round(d))} km away`;
      return { pts, d, text, log: `${fmt(Math.round(d))} km`, tv, ang, inside: d <= r };
    },
    reveal(f, gv, res) {
      ans.position.copy(res.tv.clone().multiplyScalar(1.004)); ans.visible = true;
      const r = moonFull(f) / R_KM;
      if (!f.site) marks.add(lineOf(circleOn(res.tv, r, 1.003), 0xe6b968, 0.9));
      marks.add(lineOf(circleOn(res.tv, Math.max(r, 0.02) + 0.02, 1.003), 0xe6b968, 0.35));
      if (res.ang > 0.004) marks.add(lineOf(slerpArc(gv, res.tv, 1.004, 0.06), 0xebe6da, 1, 0.025));
      const mid = gv.clone().add(res.tv), F = fit();
      return { ...faceOf(mid.lengthSq() > 1e-4 ? mid : res.tv), dist: Math.max(1.35, Math.min(F, F * (0.42 + res.ang / 2 / 1.1))) };
    },
    notes(f) {
      return {
        kind: `${f.kind} · ${f.far ? "Far side" : f.polar ? "South pole" : "Near side"}`,
        alt: f.alt || "",
        facts: [["Position", `${fmtLat(f.lat)}, ${fmtLon(f.lon)}`, true], ["Size", moonSize(f), true], ["Named", f.named]],
        prose: [["The name", `<p>${f.origin}</p>`], ["The science", `<p>${f.science}</p>`], ["The story", `<p>${f.story}</p>`], ["Sources", srcList(f)]]
      };
    },
    labels: () => [],
    ranks: total => total >= 34000 ? "Royal Astronomer. Riccioli would hand you the pen." : total >= 26000 ? "Seasoned selenographer. Your atlas would sell." : total >= 16000 ? "Keen-eyed observer. The maria are friends now." : total >= 8000 ? "Apprentice at the eyepiece." : "Moonstruck. Try it with the grid on.",
    summaryTitle: "Your lunar atlas",
    fit,
    load(tex) {
      tex.encoding = THREE.sRGBEncoding; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      globe.material.map = tex; globe.material.needsUpdate = true; this.ready = true;
    }
  };
})();

/* ======================================================================
   SKY MODE — viewed from inside the celestial sphere.
   ====================================================================== */
const skyM = (() => {
  const RS = 100;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(80, 1, 0.1, 500);
  const view = { yaw: 85 * D2R, pitch: 5 * D2R, fov: 80, offX: 0, offY: 0 };
  const figs = new THREE.Group(), bords = new THREE.Group(), grid = new THREE.Group(), marks = new THREE.Group();
  grid.visible = false; bords.visible = false;
  scene.add(figs, bords, grid, marks);
  const pin = dot(0x86cdf5), ans = dot(0xe6b968); pin.visible = ans.visible = false; scene.add(pin, ans);
  let SKY = null, starMat = null;
  const C = {}; // per-constellation computed data

  const bvColor = bv => {
    const st = [[-0.3, [0.62, 0.74, 1]], [0, [0.80, 0.87, 1]], [0.4, [1, 0.98, 0.95]], [0.8, [1, 0.92, 0.78]], [1.2, [1, 0.82, 0.6]], [1.9, [1, 0.68, 0.45]]];
    if (bv <= st[0][0]) return st[0][1];
    for (let i = 1; i < st.length; i++) if (bv <= st[i][0]) { const t = (bv - st[i - 1][0]) / (st[i][0] - st[i - 1][0]); return st[i - 1][1].map((c, k) => c + (st[i][1][k] - c) * t); }
    return st[st.length - 1][1];
  };
  const insideC = (ra, dec, id) => {
    const rings = SKY.bounds[id], ncp = SKY.meta[id][6] === 1; let c = 0;
    for (const ring of rings) for (let i = 0; i < ring.length; i++) {
      const [a1, d1] = ring[i], [a2, d2] = ring[(i + 1) % ring.length];
      const da = wrap180(a2 - a1); if (!da) continue;
      const t = wrap180(ra - a1) / da;
      if (t >= 0 && t < 1 && d1 + (d2 - d1) * t > dec) c++;
    }
    return (c % 2 === 1) !== ncp;
  };
  const whichC = (ra, dec) => Object.keys(SKY.bounds).find(id => insideC(ra, dec, id));

  const build = data => {
    SKY = data;
    const s = data.stars, n = s.length / 4, pos = new Float32Array(n * 3), col = new Float32Array(n * 3), size = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const v = vec(s[i * 4 + 1], s[i * 4], RS);
      pos.set([v.x, v.y, v.z], i * 3);
      col.set(bvColor(s[i * 4 + 3]), i * 3);
      size[i] = 2 + (5.8 - s[i * 4 + 2]) * 1.9;
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setAttribute("color", new THREE.BufferAttribute(col, 3));
    g.setAttribute("size", new THREE.BufferAttribute(size, 1));
    starMat = new THREE.ShaderMaterial({
      uniforms: { scale: { value: 1 } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      vertexShader: "attribute float size; attribute vec3 color; varying vec3 vC; uniform float scale; void main(){ vC=color; gl_PointSize=size*scale; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }",
      fragmentShader: "varying vec3 vC; void main(){ float d=length(gl_PointCoord-0.5); float core=smoothstep(0.26,0.0,d); float halo=smoothstep(0.5,0.0,d)*0.45; float a=clamp(core+halo,0.0,1.0); gl_FragColor=vec4(vC*a,a); }"
    });
    scene.add(new THREE.Points(g, starMat));
    // figures
    const fp = [];
    for (const id in data.lines) for (const seg of data.lines[id]) for (let i = 0; i < seg.length - 1; i++) fp.push(vec(seg[i][1], seg[i][0], RS * 0.995), vec(seg[i + 1][1], seg[i + 1][0], RS * 0.995));
    figs.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(fp), new THREE.LineBasicMaterial({ color: 0x7f9ac4, transparent: true, opacity: 0.38 })));
    // borders
    const bp = [];
    for (const id in data.bounds) for (const ring of data.bounds[id]) for (let i = 0; i < ring.length; i++) { const a = ring[i], b = ring[(i + 1) % ring.length]; bp.push(vec(a[1], a[0], RS * 0.996), vec(b[1], b[0], RS * 0.996)); }
    bords.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(bp), new THREE.LineBasicMaterial({ color: 0x9a8a6a, transparent: true, opacity: 0.22 })));
    // equatorial grid
    for (let dec = -60; dec <= 60; dec += 30) { const p = []; for (let ra = 0; ra <= 360; ra += 2) p.push(vec(dec, ra, RS * 0.997)); grid.add(lineOf(p, 0x86cdf5, dec ? 0.16 : 0.38)); }
    for (let ra = 0; ra < 360; ra += 30) { const p = []; for (let dec = -88; dec <= 88; dec += 2) p.push(vec(dec, ra, RS * 0.997)); grid.add(lineOf(p, 0x86cdf5, ra ? 0.16 : 0.38)); }
    // per-constellation
    for (const id in data.bounds) {
      const m = data.meta[id];
      C[id] = {
        verts: data.bounds[id].flat().map(([a, d]) => vec(d, a)),
        center: vec(m[3], m[2]), area: m[0], rank: m[1], ra: m[2], dec: m[3],
        decMin: id === "Oct" ? -90 : m[4], decMax: m[6] ? 90 : m[5]
      };
    }
    skyM.ready = true;
  };

  const availTan = () => { const p = panelBox(); return Math.min((H - p.y) / H, (W - p.x) / H); };
  const dirOf = () => vec(view.pitch / D2R, view.yaw / D2R);
  let lbls = [];

  return {
    id: "sky", scene, camera, view, ready: false, pool: STARS, grid, figs, bords,
    brand: "Uranographer", unit: "Chart", legend: "the constellation",
    help: "You're inside the sky looking out. Drag to look around, scroll or pinch to zoom. Click anywhere within the constellation's borders, then lock it in.",
    home: () => ({ fov: 80, offX: 0, offY: 0 }),
    north: () => ({ yaw: view.yaw, pitch: 62 * D2R, fov: 100 }),
    south: () => ({ yaw: view.yaw, pitch: -62 * D2R, fov: 100 }),
    apply(now, state) {
      camera.fov = view.fov; camera.updateProjectionMatrix();
      camera.position.set(0, 0, 0); camera.up.set(0, 1, 0); camera.lookAt(dirOf());
      if (view.offX || view.offY) camera.setViewOffset(W, H, view.offX, view.offY, W, H); else camera.clearViewOffset();
      if (starMat) starMat.uniforms.scale.value = renderer.getPixelRatio() * Math.min(2.2, Math.max(0.85, Math.sqrt(70 / view.fov)));
      const s = RS * view.fov * D2R * 0.0065;
      pin.scale.setScalar(s); ans.scale.setScalar(s * (1 + (state === "revealed" && !reduced ? 0.25 * Math.sin(now / 260) : 0)));
    },
    drag(dx, dy) {
      const k = view.fov * D2R / H;
      view.yaw += dx * k; view.pitch = Math.max(-89.5 * D2R, Math.min(89.5 * D2R, view.pitch + dy * k));
    },
    zoom(f) { view.fov = Math.max(18, Math.min(115, view.fov * f)); },
    arrow(dx, dy) { const k = view.fov * D2R * 0.08; view.yaw += dx * k; view.pitch = Math.max(-89.5 * D2R, Math.min(89.5 * D2R, view.pitch + dy * k)); },
    pick(ray) { return ray.ray.direction.clone().normalize(); },
    readout(v, tag) {
      const { lat, lon } = toLatLon(v), id = whichC(lon, lat), c = id && SKY.meta[id] ? STARS.find(s => s.id === id) : null;
      return `${tag} <span>RA ${fmtRA(lon)} · Dec ${fmtDec(lat)}</span>`;
    },
    setPin(v) { if (!v) { pin.visible = false; return; } pin.position.copy(v.clone().multiplyScalar(RS * 0.99)); pin.visible = true; },
    clear() { pin.visible = ans.visible = false; while (marks.children.length) marks.children.pop().geometry.dispose(); lbls.forEach(l => l.el.remove()); lbls = []; },
    chips(f) {
      const c = C[f.id], out = [`<span class="chip">${fmt(Math.round(c.area))} sq°</span>`];
      if (f.zodiac) out.push(`<span class="chip">Zodiac</span>`);
      if (c.dec < -25) out.push(`<span class="chip far">Southern sky</span>`);
      else if (c.dec > 45) out.push(`<span class="chip far">Far north</span>`);
      return out.join("");
    },
    score(f, gv) {
      const { lat, lon } = toLatLon(gv), c = C[f.id];
      const inside = insideC(lon, lat, f.id);
      let d = 0;
      if (!inside) { let best = Math.PI; for (const v of c.verts) { const a = gv.angleTo(v); if (a < best) best = a; } d = best / D2R; }
      const pts = inside ? MAX : Math.round(MAX * Math.exp(-d / 10));
      const moons = Math.round(d / 0.52);
      const text = inside ? "Inside the constellation's borders" : `${d.toFixed(1)}° outside the borders, about ${fmt(moons)} full-Moon widths`;
      return { pts, d, text, log: inside ? "inside" : `${d.toFixed(1)}°`, inside };
    },
    reveal(f, gv, res) {
      const c = C[f.id];
      // boundary + figure in gold
      for (const ring of SKY.bounds[f.id]) { const p = ring.map(([a, d]) => vec(d, a, RS * 0.993)); p.push(p[0]); marks.add(lineOf(p, 0xe6b968, 0.85)); }
      const fp = []; for (const seg of SKY.lines[f.id] || []) for (let i = 0; i < seg.length - 1; i++) fp.push(vec(seg[i][1], seg[i][0], RS * 0.992), vec(seg[i + 1][1], seg[i + 1][0], RS * 0.992));
      marks.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(fp), new THREE.LineBasicMaterial({ color: 0xe6b968, transparent: true, opacity: 0.95 })));
      ans.position.copy(c.center.clone().multiplyScalar(RS * 0.99)); ans.visible = !res.inside;
      if (!res.inside) {
        let near = c.verts[0], best = 9; for (const v of c.verts) { const a = gv.angleTo(v); if (a < best) { best = a; near = v; } }
        marks.add(lineOf(slerpArc(gv, near, RS * 0.99, 0), 0xebe6da, 1, 0.9));
      }
      // labels
      const add = (text, v, big) => { const el = document.createElement("div"); el.className = "lbl" + (big ? " big" : ""); el.textContent = text; $("labels").appendChild(el); lbls.push({ el, v: v.clone().multiplyScalar(RS) }); };
      add(f.name, c.center, true);
      (SKY.named[f.id] || []).slice(0, 4).forEach(([nm, ra, dec]) => add(nm, vec(dec, ra), false));
      // frame
      const fovFor = (cv, withGuess) => {
        let m = 0; for (const v of c.verts) m = Math.max(m, cv.angleTo(v)); if (withGuess) m = Math.max(m, cv.angleTo(gv));
        return 2 * Math.atan(Math.tan(Math.min(m * 1.12, 80 * D2R)) / availTan()) / D2R;
      };
      // Frame the pin and the constellation together when that fits; otherwise frame the constellation.
      let centerV = res.inside ? c.center : gv.clone().normalize().add(c.center).normalize();
      let fov = fovFor(centerV, !res.inside);
      if (fov > 105) { centerV = c.center; fov = fovFor(centerV, false); }
      fov = Math.max(30, Math.min(110, fov));
      const { lat, lon } = toLatLon(centerV);
      return { yaw: lon * D2R, pitch: lat * D2R, fov };
    },
    notes(f) {
      const c = C[f.id], bright = (SKY.named[f.id] || [])[0];
      const raH = ((c.ra + 360) % 360) / 15, month = Math.round(((raH - 6) / 2 + 24) % 12) % 12;
      const nLim = Math.round(90 + c.decMin), sLim = Math.round(c.decMax - 90);
      const lat = x => x >= 90 ? "the North Pole" : x <= -90 ? "the South Pole" : `${Math.abs(x)}°${x >= 0 ? "N" : "S"}`;
      // Viewing from California (central latitude ~36.8°N; San Diego 32.7°N).
      const CA = 36.8, SD = 32.7;
      const peak = Math.round(90 - Math.abs(CA - Math.max(c.decMin, Math.min(c.decMax, c.dec))));
      const dst = month >= 2 && month <= 9 ? " (10 p.m. daylight time)" : "";
      let ca;
      if (c.decMax < SD - 90) ca = "Never rises anywhere in California. You would need to travel south of about 30°N to see it.";
      else if (c.decMax < CA - 90) ca = `Below the horizon for most of California. From San Diego its northern edge just skims the southern horizon on ${MONTHS[month]} evenings.`;
      else if (c.decMin > 90 - CA) ca = `Never sets: it circles Polaris all night, all year. Highest on ${MONTHS[month]} evenings around 9 p.m.${dst}.`;
      else if (c.decMin < CA - 90) ca = `Only the northern part clears the horizon. Look low in the south on ${MONTHS[month]} evenings around 9 p.m.${dst}.`;
      else ca = `${MONTHS[month]} evenings around 9 p.m.${dst}, when it reaches about ${peak}° above the ${c.dec > CA ? "northern" : "southern"} horizon.`;
      const facts = [
        ["IAU code", f.id, true],
        ["Area", `${fmt(Math.round(c.area))} sq°, ${ordinal(c.rank)} of 88`, true],
        ["From California", ca],
        ["Fully visible", nLim >= 90 && sLim <= -90 ? "From everywhere on Earth" : `Between ${lat(sLim)} and ${lat(nLim)}`]
      ];
      if (bright) facts.splice(2, 0, ["Brightest", `${bright[0]}, magnitude ${bright[3].toFixed(2)}`]);
      const names = `<ul class="names">${f.names.map(([cu, nm, gl]) => `<li><span class="cu">${cu}</span><span class="nm">${nm}</span><span class="gl">${gl}</span></li>`).join("")}</ul>`;
      return {
        kind: `Constellation${f.zodiac ? " · Zodiac" : ""} · ${c.dec >= 0 ? "Northern" : "Southern"} sky`,
        alt: f.meaning,
        facts,
        prose: [["Names across cultures", names], ["The science", `<p>${f.science}</p>`], ["The story", `<p>${f.story}</p>`], ["Sources", srcList(f)]]
      };
    },
    labels: () => lbls,
    ranks: total => total >= 34000 ? "Royal Astronomer. You could chart the heavens by hand." : total >= 26000 ? "Practiced uranographer. Navigators would trust you." : total >= 16000 ? "Keen-eyed stargazer. The figures are falling into place." : total >= 8000 ? "Apprentice sky-watcher." : "Lost among the stars. Try with Borders on.",
    summaryTitle: "Your star chart",
    build
  };
})();

const MODES = { moon: moonM, sky: skyM };
let mode = moonM;

/* ======================================================================
   Resize, tween, input
   ====================================================================== */
const resize = () => {
  W = stage.clientWidth; H = stage.clientHeight;
  renderer.setSize(W, H, false);
  for (const m of Object.values(MODES)) { m.camera.aspect = W / H; m.camera.updateProjectionMatrix(); }
};
new ResizeObserver(resize).observe(stage); resize();
moonM.view.dist = moonM.fit();

let tween = null;
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const goTo = (target, ms = 1100) => {
  const v = mode.view, from = { ...v }, to = { ...v, ...target };
  if ("yaw" in target) { let dy = (to.yaw - from.yaw) % (Math.PI * 2); if (dy > Math.PI) dy -= Math.PI * 2; if (dy < -Math.PI) dy += Math.PI * 2; to.yaw = from.yaw + dy; }
  tween = { m: mode, from, to, t0: performance.now(), ms: reduced ? 1 : ms };
};
const offsets = () => { const p = panelBox(); return { offX: p.x / 2, offY: p.y / 2 }; };

const ptrs = new Map();
let downAt = null, moved = false, pinchD = 0, hoverQueued = null;
const ray = new THREE.Raycaster();
const rayAt = (x, y) => { const r = canvas.getBoundingClientRect(); ray.setFromCamera(new THREE.Vector2((x - r.left) / r.width * 2 - 1, -((y - r.top) / r.height) * 2 + 1), mode.camera); return ray; };
canvas.addEventListener("pointerdown", e => {
  canvas.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) { downAt = { x: e.clientX, y: e.clientY }; moved = false; }
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinchD = Math.hypot(a.x - b.x, a.y - b.y); moved = true; }
});
canvas.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) { if (e.pointerType === "mouse") hoverQueued = { x: e.clientX, y: e.clientY }; return; }
  const prev = ptrs.get(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 1) {
    if (!moved && Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 6) { moved = true; canvas.classList.add("dragging"); }
    if (moved) { tween = null; mode.drag(e.clientX - prev.x, e.clientY - prev.y); }
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchD) { tween = null; mode.zoom(pinchD / d); }
    pinchD = d;
  }
});
const endPtr = e => {
  if (!ptrs.has(e.pointerId)) return;
  const single = ptrs.size === 1;
  ptrs.delete(e.pointerId);
  canvas.classList.remove("dragging");
  if (e.type === "pointerup" && single && !moved && state === "guessing") { mode.camera.updateMatrixWorld(); const v = mode.pick(rayAt(e.clientX, e.clientY)); if (v) placePin(v); }
  if (ptrs.size < 2) pinchD = 0;
};
canvas.addEventListener("pointerup", endPtr);
canvas.addEventListener("pointercancel", endPtr);
canvas.addEventListener("pointerleave", () => { if (!ptrs.size) showReadout(null); });
canvas.addEventListener("wheel", e => { e.preventDefault(); tween = null; mode.zoom(Math.exp(e.deltaY * 0.0015)); }, { passive: false });
addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("button") && (e.key === "Enter" || e.key === " ")) return;
  const sky = mode === skyM;
  if (e.key === "ArrowLeft") mode.arrow(sky ? 1 : 1, 0); else if (e.key === "ArrowRight") mode.arrow(-1, 0);
  else if (e.key === "ArrowUp") mode.arrow(0, 1); else if (e.key === "ArrowDown") mode.arrow(0, -1);
  else if (e.key === "+" || e.key === "=") mode.zoom(0.85); else if (e.key === "-") mode.zoom(1.18);
  else if (e.key === "Enter") { e.preventDefault(); if (state === "guessing" && guess) lockIn(); else if (state === "revealed") next(); return; }
  else return;
  tween = null; e.preventDefault();
});

const showReadout = (v, tag) => {
  if (!v) { $("readout").innerHTML = guess && state === "guessing" ? mode.readout(guess, "pin") : ""; return; }
  $("readout").innerHTML = mode.readout(v, tag || "cursor");
};

/* ======================================================================
   Game flow
   ====================================================================== */
let state = "loading", rounds = [], idx = 0, results = [], guess = null;
const total = () => results.reduce((s, r) => s + r.pts, 0);

const syncChrome = () => {
  $("brand").textContent = mode.brand;
  document.querySelectorAll(".modes button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode.id)));
  document.querySelectorAll("#controls [data-for]").forEach(b => { b.hidden = b.dataset.for !== mode.id; });
  $("b-grid").setAttribute("aria-pressed", String(mode.grid.visible));
  $("p-help").textContent = mode.help;
  $("n-legend").textContent = mode.legend;
  $("loading").hidden = mode.ready;
};

const setMode = (id, restore) => {
  if (tween) tween = null;
  if (mode) { mode.clear(); mode.view.offX = mode.view.offY = 0; }
  mode = MODES[id];
  store.set("selenographer-mode", id);
  $("labels").innerHTML = "";
  syncChrome();
  if (!mode.ready) { state = "loading"; $("prompt").hidden = $("controls").hidden = true; $("notes").hidden = $("summary").hidden = true; return; }
  $("prompt").hidden = false;
  if (restore) restore(); else newGame();
};

const newGame = () => {
  const by = t => shuffle(mode.pool.filter(f => f.tier === t));
  rounds = [...by(1).slice(0, 3), ...by(2).slice(0, 3), ...by(3).slice(0, 2)];
  idx = 0; results = [];
  $("summary").hidden = true;
  startRound();
};

const startRound = () => {
  const f = rounds[idx];
  state = "guessing"; guess = null;
  mode.clear();
  $("notes").hidden = true; document.body.classList.remove("revealed");
  $("controls").hidden = false; $("prompt").hidden = false;
  $("t-round").textContent = `${mode.unit} ${idx + 1} / ${ROUNDS}`;
  $("t-score").textContent = fmt(total());
  $("p-name").textContent = f.name;
  const alt = f.alt || f.meaning;
  $("p-alt").hidden = !alt; $("p-alt").textContent = alt || "";
  $("p-meta").innerHTML = mode.chips(f);
  updateLock();
  canvas.classList.add("aim");
  goTo(mode.home(), 900);
  showReadout(null);
  snapshot();
};

const placePin = v => {
  guess = v.clone().normalize();
  mode.setPin(guess);
  updateLock();
  showReadout(guess, "pin");
};
const updateLock = () => { const b = $("b-lock"); b.disabled = !guess; b.textContent = guess ? "Lock in guess" : "Drop a pin"; };

const lockIn = () => {
  if (state !== "guessing" || !guess) return;
  const f = rounds[idx], res = mode.score(f, guess);
  results.push({ f, pts: res.pts, log: res.log });
  state = "revealed";
  canvas.classList.remove("aim");

  const pts = res.pts;
  $("n-verdict").textContent = pts === MAX ? (mode === skyM ? "Right on target" : f.site ? "Right on the spot" : "Direct hit") : pts > 3500 ? "Close" : pts > 1500 ? "In the neighborhood" : pts > 300 ? "Wrong region" : "Way off";
  $("n-pts").textContent = fmt(pts);
  $("n-dist").textContent = res.text;
  const n = mode.notes(f);
  $("n-kind").textContent = n.kind;
  $("n-name").textContent = f.name;
  $("n-alt").hidden = !n.alt; $("n-alt").textContent = n.alt;
  $("n-facts").innerHTML = n.facts.map(([k, v, num]) => `<dt>${k}</dt><dd${num ? ' class="num"' : ""}>${v}</dd>`).join("");
  $("n-prose").innerHTML = n.prose.map(([h, body]) => `<h3>${h}</h3>${body}`).join("");
  $("b-next").textContent = idx + 1 < ROUNDS ? `Next ${mode.unit.toLowerCase()}` : "See your results";
  $("controls").hidden = true;
  $("notes").hidden = false; $("notes").scrollTop = 0;
  document.body.classList.add("revealed");
  $("t-score").textContent = fmt(total());
  $("readout").innerHTML = "";
  const frame = mode.reveal(f, guess, res);
  goTo({ ...frame, ...offsets() }, 1300);
  $("b-next").focus({ preventScroll: true });
  snapshot();
};

const next = () => { if (state !== "revealed") return; idx++; if (idx < ROUNDS) startRound(); else finish(); };

const finish = () => {
  state = "done";
  mode.clear();
  $("notes").hidden = true; document.body.classList.remove("revealed");
  $("controls").hidden = true; $("prompt").hidden = true;
  const t = total(), key = `selenographer-best-${mode.id}`;
  const best = Math.max(t, +(store.get(key) || 0));
  store.set(key, String(best));
  $("s-title").textContent = mode.summaryTitle;
  $("s-total").textContent = fmt(t);
  $("s-best").textContent = best > t ? `· best ${fmt(best)}` : "· your best yet";
  $("s-rank").textContent = mode.ranks(t);
  $("s-log").innerHTML = results.map(r => `<tr><td>${r.f.name}</td><td class="n">${r.log}</td><td class="n">${fmt(r.pts)}</td></tr>`).join("");
  $("b-switch").textContent = mode === moonM ? "Try the stars" : "Try the Moon";
  $("summary").hidden = false;
  $("b-again").focus({ preventScroll: true });
  goTo({ ...mode.home(), offX: 0, offY: 0 }, 1600);
  snapshot();
};

$("b-lock").onclick = lockIn;
$("b-next").onclick = next;
$("b-again").onclick = newGame;
$("b-switch").onclick = () => setMode(mode === moonM ? "sky" : "moon");
document.querySelectorAll(".modes button").forEach(b => b.onclick = () => { if (b.dataset.mode !== mode.id) setMode(b.dataset.mode); });
$("b-near").onclick = () => goTo({ ...moonM.home(), ...offsets() }, 800);
$("b-far").onclick = () => goTo({ ...moonM.far(), ...offsets() }, 1000);
$("b-north").onclick = () => goTo(skyM.north(), 900);
$("b-south").onclick = () => goTo(skyM.south(), 900);
$("b-grid").onclick = e => { mode.grid.visible = !mode.grid.visible; e.currentTarget.setAttribute("aria-pressed", String(mode.grid.visible)); };
$("b-fig").onclick = e => { skyM.figs.visible = !skyM.figs.visible; e.currentTarget.setAttribute("aria-pressed", String(skyM.figs.visible)); };
$("b-bounds").onclick = e => { skyM.bords.visible = !skyM.bords.visible; e.currentTarget.setAttribute("aria-pressed", String(skyM.bords.visible)); };

/* ======================================================================
   Loop
   ====================================================================== */
const tmp = new THREE.Vector3();
const loop = now => {
  if (tween) {
    const t = Math.min(1, (now - tween.t0) / tween.ms), k = easeIO(t);
    for (const key in tween.to) tween.m.view[key] = tween.from[key] + (tween.to[key] - tween.from[key]) * k;
    if (t >= 1) tween = null;
  } else if (state === "done" && !reduced) {
    mode.view.yaw += mode === moonM ? -0.0012 : 0.0006;
  }
  mode.apply(now, state);
  mode.scene.updateMatrixWorld();
  mode.camera.updateMatrixWorld();
  if (hoverQueued && !ptrs.size) {
    if (state === "guessing") { const v = mode.pick(rayAt(hoverQueued.x, hoverQueued.y)); showReadout(v || null); }
    hoverQueued = null;
  }
  const fwd = mode.camera.getWorldDirection(new THREE.Vector3());
  for (const l of mode.labels()) {
    tmp.copy(l.v);
    if (tmp.clone().normalize().dot(fwd) < 0.05) { l.el.style.display = "none"; continue; }
    tmp.project(mode.camera);
    const x = (tmp.x + 1) / 2 * W, y = (1 - tmp.y) / 2 * H;
    l.el.style.display = "";
    l.el.style.transform = `translate(${Math.round(x + 8)}px, ${Math.round(y - 8)}px)`;
  }
  renderer.render(mode.scene, mode.camera);
  requestAnimationFrame(loop);
};

/* ======================================================================
   Boot + persistence across live updates
   ====================================================================== */
const snapshot = () => window.claude?.hot?.snapshot?.(() => ({ mode: mode.id, names: rounds.map(f => f.name), done: results.map(r => ({ name: r.f.name, pts: r.pts, log: r.log })) }));

const start = data => {
  const want = data?.mode || store.get("selenographer-mode") || "moon";
  const restoreFor = id => {
    if (!data || data.mode !== id || !data.names) return null;
    const pool = MODES[id].pool, byName = n => pool.find(f => f.name === n);
    if (!data.names.every(byName)) return null;
    return () => {
      rounds = data.names.map(byName);
      results = (data.done || []).filter(r => byName(r.name)).map(r => ({ ...r, f: byName(r.name) }));
      idx = results.length;
      if (idx < ROUNDS) startRound(); else finish();
    };
  };
  const ready = id => { if (mode.id === id && state === "loading") setMode(id, restoreFor(id)); else syncChrome(); };
  mode = MODES[want] || moonM;
  syncChrome();
  $("prompt").hidden = $("controls").hidden = true;
  // Load the map as a same-origin blob so WebGL never sees a cross-origin image.
  const imgFrom = src => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
  fetch("moon.jpg").then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); })
    .then(b => imgFrom(URL.createObjectURL(b)))
    .catch(() => imgFrom("moon.jpg"))
    .then(im => { const tex = new THREE.Texture(im); tex.needsUpdate = true; moonM.load(tex); ready("moon"); })
    .catch(() => { if (mode === moonM) $("loading").textContent = "The lunar map didn't load. Reload the page to try again."; });
  fetch("sky-data.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(d => { skyM.build(d); ready("sky"); })
    .catch(() => { if (mode === skyM) $("loading").textContent = "The star catalog didn't load. Reload the page to try again."; });
  requestAnimationFrame(loop);
};
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</body></html>
