<meta charset="utf-8">
<title>Selenographer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed night-sky stage; prompt card top-left, field notes slide in right (bottom sheet on phones). */
:root {
  --void: #0a0c13;
  --panel: #121521;
  --line: #262b3c;
  --ink: #ebe6da;
  --muted: #9599a8;
  --answer: #e6b968;
  --guess: #86cdf5;
  --display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --body: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--void); color: var(--ink); font-family: var(--body); font-size: 15px; overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#stage canvas.dragging { cursor: grabbing; }
#stage canvas.aim { cursor: crosshair; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; white-space: nowrap; font-family: var(--mono); font-size: 11px; color: var(--answer); text-shadow: 0 0 4px var(--void), 0 0 2px var(--void); }
.lbl.big { font-family: var(--display); font-style: italic; font-size: 20px; letter-spacing: .02em; }

.hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 12px) 18px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; pointer-events: none; }
.hud-left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-size: 22px; letter-spacing: .01em; }
.modes { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; pointer-events: auto; }
.modes button { border: 0; border-radius: 0; padding: 6px 12px; font-size: 13px; background: transparent; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--void); }
.tally { font-family: var(--mono); font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.tally b { color: var(--ink); font-weight: 500; font-size: 17px; }

#prompt { position: fixed; left: 18px; top: calc(env(safe-area-inset-top, 0px) + 62px); max-width: 340px; padding: 16px 18px 15px; background: color-mix(in srgb, var(--panel) 86%, transparent); border: 1px solid var(--line); border-radius: 6px; backdrop-filter: blur(6px); display: grid; gap: 6px; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
#prompt h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 38px; line-height: 1.02; text-wrap: balance; }
#p-alt { font-family: var(--display); font-style: italic; color: var(--muted); font-size: 17px; }
#p-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chip { font-family: var(--mono); font-size: 11px; padding: 3px 7px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); }
.chip.far { color: var(--answer); border-color: color-mix(in srgb, var(--answer) 45%, transparent); }
#p-help { font-size: 13px; color: var(--muted); line-height: 1.45; margin-top: 4px; }

#controls { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; width: max-content; max-width: calc(100% - 32px); }
button { font: 500 14px var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 10px 14px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button:focus-visible { outline: 2px solid var(--guess); outline-offset: 2px; }
button.tog[aria-pressed="true"] { color: var(--guess); border-color: color-mix(in srgb, var(--guess) 50%, transparent); }
button.primary { background: var(--answer); color: #1b1407; border-color: var(--answer); font-weight: 600; padding-inline: 20px; }
button.primary:disabled { background: var(--panel); color: var(--muted); border-color: var(--line); cursor: not-allowed; }

#readout { position: fixed; right: 18px; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; pointer-events: none; text-align: right; }
#readout span { color: var(--guess); }

#notes { position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 100%; background: var(--panel); border-left: 1px solid var(--line); padding: calc(env(safe-area-inset-top, 0px) + 22px) 26px calc(env(safe-area-inset-bottom, 0px) + 22px); overflow-y: auto; display: flex; flex-direction: column; gap: 18px; animation: slidein .45s cubic-bezier(.2,.8,.2,1); }
@keyframes slidein { from { transform: translateX(24px); opacity: .4; } }
.result { display: grid; gap: 4px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.result .pts { font-family: var(--display); font-size: 46px; line-height: 1; color: var(--answer); font-variant-numeric: tabular-nums; }
.result .pts small { font-family: var(--mono); font-size: 13px; color: var(--muted); margin-left: 6px; }
.result .dist { font-family: var(--mono); font-size: 13px; color: var(--ink); }
.legend { display: flex; gap: 14px; font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
#notes h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.05; text-wrap: balance; }
#n-alt { font-family: var(--display); font-style: italic; font-size: 18px; color: var(--muted); margin-top: -12px; }
dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; font-size: 13px; }
dt { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-top: 2px; }
dd { margin: 0; min-width: 0; }
dd.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.prose { display: grid; gap: 12px; line-height: 1.6; font-size: 15px; max-width: 62ch; }
.prose p { margin: 0; }
.src { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13px; line-height: 1.45; color: var(--muted); }
.src a { color: inherit; text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
.src a:hover { color: var(--ink, inherit); }
.prose h3 { margin: 6px 0 -4px; font-family: var(--mono); font-weight: 400; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.names { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.names li { display: grid; grid-template-columns: 7.5em 1fr; gap: 2px 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.names li:first-child { border-top: 0; padding-top: 2px; }
.names .cu { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding-top: 4px; }
.names .nm { font-family: var(--display); font-size: 19px; line-height: 1.2; }
.names .gl { grid-column: 2; font-size: 13.5px; color: var(--muted); line-height: 1.45; }
#notes .primary { margin-top: auto; width: 100%; padding-block: 13px; flex-shrink: 0; }

#summary { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--void) 72%, transparent); backdrop-filter: blur(3px); }
.sheet { width: 100%; max-width: 520px; max-height: calc(100% - 32px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 26px; display: grid; gap: 16px; }
.sheet h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 40px; line-height: 1; }
.sheet .total { font-family: var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.sheet .total b { color: var(--answer); font-size: 22px; font-weight: 500; }
.log { width: 100%; border-collapse: collapse; font-size: 14px; }
.log td { padding: 8px 0; border-top: 1px solid var(--line); }
.log td.n { font-family: var(--mono); font-size: 12px; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; padding-left: 12px; white-space: nowrap; }
.rank { font-family: var(--display); font-style: italic; font-size: 19px; }
.sheet .row { display: flex; gap: 8px; flex-wrap: wrap; }
.sheet .row button { flex: 1 1 160px; }

#loading { position: fixed; inset: 0; display: grid; place-items: center; font-family: var(--display); font-style: italic; font-size: 20px; color: var(--muted); }

body.revealed #prompt { display: none; }
@media (max-width: 760px) {
  .brand { font-size: 19px; }
  #prompt { left: 16px; right: 16px; max-width: none; top: calc(env(safe-area-inset-top, 0px) + 54px); padding: 12px 14px; gap: 4px; }
  #prompt h1 { font-size: 30px; }
  #p-help { display: none; }
  #controls button { padding: 9px 11px; font-size: 13px; }
  #readout { left: 16px; right: 16px; text-align: center; bottom: calc(env(safe-area-inset-bottom, 0px) + 112px); }
  #notes { top: auto; left: 0; width: 100%; max-height: 56%; border-left: 0; border-top: 1px solid var(--line); border-radius: 10px 10px 0 0; padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 16px); gap: 14px; animation-name: slideup; }
  @keyframes slideup { from { transform: translateY(30px); opacity: .4; } }
  .result .pts { font-size: 38px; }
  #notes h2 { font-size: 28px; }
  .names li { grid-template-columns: 1fr; }
  .names .gl { grid-column: 1; }
}
@media (prefers-reduced-motion: reduce) { #notes { animation: none; } }
</style>

<div id="stage"></div>
<div id="labels"></div>

<div class="hud">
  <div class="hud-left">
    <div class="brand" id="brand">Selenographer</div>
    <div class="modes" aria-label="Game">
      <button type="button" data-mode="moon" aria-pressed="true">Moon</button>
      <button type="button" data-mode="sky" aria-pressed="false">Stars</button>
    </div>
  </div>
  <div class="tally"><span id="t-round">Plate 1 / 8</span><br><b id="t-score">0</b> pts</div>
</div>

<section id="prompt" aria-live="polite">
  <div class="eyebrow">Locate</div>
  <h1 id="p-name"></h1>
  <div id="p-alt" hidden></div>
  <div id="p-meta"></div>
  <div id="p-help"></div>
</section>

<div id="controls">
  <button id="b-near" type="button" data-for="moon">Face Earth</button>
  <button id="b-far" type="button" data-for="moon">Far side</button>
  <button id="b-north" type="button" data-for="sky">North</button>
  <button id="b-south" type="button" data-for="sky">South</button>
  <button id="b-fig" type="button" class="tog" data-for="sky" aria-pressed="true">Figures</button>
  <button id="b-bounds" type="button" class="tog" data-for="sky" aria-pressed="false">Borders</button>
  <button id="b-grid" type="button" class="tog" aria-pressed="false">Grid</button>
  <button id="b-lock" type="button" class="primary" disabled>Drop a pin</button>
</div>

<div id="readout"></div>

<aside id="notes" hidden aria-live="polite">
  <div class="result">
    <div class="eyebrow" id="n-verdict">Result</div>
    <div class="pts"><span id="n-pts">0</span><small>/ 5,000</small></div>
    <div class="dist" id="n-dist"></div>
    <div class="legend"><span><i style="background:var(--guess)"></i>your pin</span><span><i style="background:var(--answer)"></i><span id="n-legend">the feature</span></span></div>
  </div>
  <div class="eyebrow" id="n-kind"></div>
  <h2 id="n-name"></h2>
  <div id="n-alt"></div>
  <dl id="n-facts"></dl>
  <div class="prose" id="n-prose"></div>
  <button id="b-next" type="button" class="primary">Next</button>
</aside>

<div id="summary" hidden>
  <div class="sheet">
    <div class="eyebrow">Survey complete</div>
    <h2 id="s-title">Your atlas</h2>
    <div class="total"><b id="s-total">0</b> / 40,000 pts <span id="s-best"></span></div>
    <div class="rank" id="s-rank"></div>
    <table class="log"><tbody id="s-log"></tbody></table>
    <div class="row">
      <button id="b-again" type="button" class="primary">Play again</button>
      <button id="b-switch" type="button">Switch game</button>
    </div>
  </div>
</div>

<div id="loading">Developing the plate…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

const MOON = [
  { name: "Tycho", kind: "Crater", lat: -43.3, lon: -11.22, size: 85, tier: 1,
    named: "1651, Giovanni Battista Riccioli, in his Almagestum Novum",
    origin: "Tycho Brahe (1546–1601), the Danish astronomer whose naked-eye measurements of planetary positions were precise enough for Johannes Kepler to deduce that orbits are ellipses.",
    science: "Tycho's floor lies about 4.7 km below its rim, with a central peak about 2 km high and pools of frozen impact melt on its floor. Its rays are bright because they are fresh. Micrometeorite impacts and the solar wind slowly darken exposed lunar soil, a process called space weathering, so bright rays mark young craters. Its age, roughly 108 to 110 million years, comes from Apollo 17 samples of a landslide and secondary craters more than 2,000 km away that are thought to have been triggered by debris from Tycho.",
    story: "Its rays stretch across much of the southern near side and are easy to see with the naked eye at full Moon. Surveyor 7 landed on Tycho's northern ejecta blanket in January 1968, the only Surveyor mission sent to the rugged highlands. In 2001: A Space Odyssey, Tycho is where the monolith TMA-1 is dug up." },
  { name: "Copernicus", kind: "Crater", lat: 9.62, lon: -20.08, size: 96, tier: 1,
    named: "1651, Giovanni Battista Riccioli",
    origin: "Nicolaus Copernicus (1473–1543), who placed the Sun at the center of the planetary system.",
    science: "Copernicus is a textbook complex crater: about 3.8 km deep, with terraced walls that slumped inward right after the impact and central peaks that rebounded from below. Spectra of those peaks show olivine-rich rock lifted from kilometers down. Ray material sampled by Apollo 12 dates the impact to about 800 million years ago. The crater is the type example for the Copernican period, the youngest division of lunar history.",
    story: "Riccioli, a Jesuit who rejected the Sun-centered model, put Copernicus, Kepler and Galileo out in the Ocean of Storms. This is often read as a gentle jab. Lunar Orbiter 2's oblique view across the crater in November 1966 was widely called the picture of the century." },
  { name: "Mare Crisium", alt: "Sea of Crises", kind: "Mare", lat: 16.18, lon: 59.1, size: 556, tier: 1,
    named: "1651, Giovanni Battista Riccioli",
    origin: "Riccioli named the dark plains for weather and states of mind, reflecting the old belief that the Moon's phases influenced Earth's weather.",
    science: "Like the other maria, Crisium is an impact basin later flooded by iron-rich basalt lava, which is why it looks dark. In 1968 Paul Muller and William Sjogren tracked Lunar Orbiter spacecraft and found that orbits sped up over basins like this. The cause was mascons, mass concentrations of dense lava and uplifted mantle beneath the surface. Basalt returned by Luna 24 is about 3.3 billion years old.",
    story: "On July 21, 1969, while Armstrong and Aldrin were on the surface, the uncrewed Soviet probe Luna 15 crashed into Crisium during an attempt to return soil samples. Luna 24 succeeded here in 1976. In March 2025, Firefly's Blue Ghost lander touched down in Crisium and operated through a full lunar day." },
  { name: "Mare Tranquillitatis", alt: "Sea of Tranquility", kind: "Mare", lat: 8.35, lon: 30.83, size: 876, tier: 1,
    named: "1651, Giovanni Battista Riccioli",
    origin: "Latin for Sea of Tranquility, one of Riccioli's weather-and-temperament names.",
    science: "Its basalts are rich in titanium, mostly in the mineral ilmenite, which gives the sea a faint blue cast in color-enhanced images. Apollo 11 samples from its edge crystallized 3.6 to 3.9 billion years ago. They also contained a new mineral, armalcolite, named for Armstrong, Aldrin and Collins.",
    story: "Ranger 8 and Surveyor 5 scouted the sea before Apollo 11's lunar module Eagle landed on its southwestern edge on July 20, 1969." },
  { name: "Mare Imbrium", alt: "Sea of Showers", kind: "Mare", lat: 34.72, lon: -14.91, size: 1146, tier: 1,
    named: "1651, Giovanni Battista Riccioli",
    origin: "Imbrium means rains or showers, part of Riccioli's weather-themed set.",
    science: "Imbrium fills one of the largest and youngest major basins on the Moon, blasted out about 3.9 billion years ago. Ejecta from the impact carved long grooves and valleys across the near side, called the Imbrium sculpture. Its debris is so widespread that geologists use it as a time marker: the Imbrian period begins with this impact. Lava filled the basin over the following several hundred million years.",
    story: "In 1970 the Soviet rover Lunokhod 1, the first robotic rover on another world, drove about 10 km across the sea. China's Chang'e 3 and its Yutu rover landed in northern Imbrium in December 2013." },
  { name: "Oceanus Procellarum", alt: "Ocean of Storms", kind: "Mare", lat: 20.67, lon: -56.68, size: 2592, tier: 1,
    named: "1651, Giovanni Battista Riccioli",
    origin: "The only lunar mare called an ocean, it covers much of the western near side.",
    science: "Lunar Prospector's gamma-ray maps showed this region is enriched in thorium and other heat-producing elements, a chemical package called KREEP. This area, the Procellarum KREEP Terrane, likely stayed hot longer, which may explain why near-side volcanism lasted so long. In 2014 NASA's GRAIL gravity mission found a rectangular pattern of buried rift-like structures around it, evidence against the idea that it is one giant impact basin.",
    story: "Luna 9 made the first soft landing on the Moon here in 1966. Apollo 12 landed within walking distance of Surveyor 3 in 1969, and the crew brought home pieces of the probe. In 2020 Chang'e 5 returned basalts about 2 billion years old, the youngest lunar volcanic rocks yet sampled." },
  { name: "Mare Serenitatis", alt: "Sea of Serenity", kind: "Mare", lat: 27.29, lon: 18.36, size: 674, tier: 1,
    named: "1651, Giovanni Battista Riccioli",
    origin: "Latin for Sea of Serenity, another of Riccioli's moods.",
    science: "Serenitatis has a strong mascon, and its rim shows rings of lava with different compositions, a record of separate eruptions. Near its southeastern shore, Apollo 17 geologist Harrison Schmitt found orange soil. It turned out to be tiny glass beads from volcanic fire fountains about 3.6 billion years ago.",
    story: "Apollo 17 landed in the Taurus-Littrow valley on the sea's southeastern edge in December 1972, the last crewed landing so far. In 1973 the Soviet rover Lunokhod 2 drove about 39 km around Le Monnier crater on the eastern shore. That was the record for driving on another world until NASA's Opportunity rover passed it on Mars in 2014." },
  { name: "Plato", kind: "Crater", lat: 51.62, lon: -9.38, size: 101, tier: 1,
    named: "1651, Giovanni Battista Riccioli",
    origin: "The Greek philosopher Plato. Johannes Hevelius had earlier called it Lacus Niger Major, the Greater Black Lake.",
    science: "Plato formed after the Imbrium impact, and lava later welled up and flooded its floor. That makes it one of the smoothest and darkest spots on the Moon, rivaled only by Grimaldi. The few tiny craterlets on its floor are a classic test of telescope optics and steady air.",
    story: "Observers have reported odd glows, hazes and flashes in Plato for centuries, making it a favorite target for so-called transient lunar phenomena. Most such reports are probably tricks of lighting and Earth's atmosphere." },
  { name: "Aristarchus", kind: "Crater", lat: 23.73, lon: -47.49, size: 40, tier: 2,
    named: "1651, Giovanni Battista Riccioli",
    origin: "Aristarchus of Samos, who around 270 BC proposed that Earth orbits the Sun, about 1,800 years before Copernicus.",
    science: "This young crater is the brightest large formation on the Moon. It sits on the Aristarchus Plateau, which is blanketed with dark volcanic ash. Nearby Vallis Schröteri, about 185 km long, is the largest sinuous rille on the Moon, a channel cut by flowing lava. Apollo 15 and Lunar Prospector both detected radon gas escaping from the region.",
    story: "In 1787 William Herschel saw glowing spots on the Moon's night side and thought they were erupting volcanoes. He was almost certainly seeing Aristarchus lit by earthshine." },
  { name: "Clavius", kind: "Crater", lat: -58.62, lon: -14.73, size: 231, tier: 2,
    named: "1651, Giovanni Battista Riccioli",
    origin: "Christopher Clavius (1537/38–1612), the Jesuit mathematician behind the calculations for the Gregorian calendar of 1582.",
    science: "Clavius is roughly 4 billion years old, ancient enough that later impacts have pocked its floor. In 2020 the airborne SOFIA observatory detected molecular water in sunlit Clavius, the first clear detection of water molecules rather than other hydrated minerals. The concentration was about 100 to 400 parts per million, roughly a 12-ounce bottle of water spread through a cubic meter of soil.",
    story: "An arc of craters across its floor, each smaller than the last, is a favorite test of telescope sharpness. In 2001: A Space Odyssey, Clavius is home to the lunar base." },
  { name: "Kepler", kind: "Crater", lat: 8.12, lon: -38.01, size: 30, tier: 2,
    named: "1651, Giovanni Battista Riccioli",
    origin: "Johannes Kepler (1571–1630), who discovered the laws of planetary motion.",
    science: "Kepler is a young crater with a bright ray system. Its rays overlap those of Copernicus, showing that both impacts are recent in lunar terms. At 30 km across it sits near the size where lunar craters change from simple bowls to complex craters with terraces and central peaks.",
    story: "Kepler also wrote Somnium, a tale of a journey to the Moon published after his death in 1634 and often called one of the first works of science fiction." },
  { name: "Grimaldi", kind: "Crater", lat: -5.38, lon: -68.36, size: 235, tier: 2,
    named: "1651, Giovanni Battista Riccioli",
    origin: "Francesco Maria Grimaldi (1618–1663), Riccioli's fellow Jesuit, who drew the 1651 map on which most of today's lunar names first appeared. He also discovered and named the diffraction of light.",
    science: "Grimaldi is actually a small two-ring impact basin, with a faint outer ring about 430 km across. Its dark mare floor is one of the darkest spots on the near side, and gravity surveys show a mascon beneath it.",
    story: "Riccioli gave his collaborator a prominent crater and placed his own crater, Riccioli, right next door." },
  { name: "Langrenus", kind: "Crater", lat: -8.86, lon: 61.04, size: 132, tier: 2,
    named: "1645, by Michael van Langren himself",
    origin: "Michael van Langren (Langrenus), the Flemish cartographer who published the first lunar map with named features.",
    science: "Langrenus is a well-preserved complex crater with terraced walls and a central peak complex. It is younger than the surrounding Mare Fecunditatis, so it has bright walls and faint rays.",
    story: "Van Langren hoped for royal patronage, so he named about 300 features after Spanish royalty, saints and Catholic notables. Riccioli replaced nearly all of them six years later. The crater van Langren named after himself is one of the few that survived." },
  { name: "Ptolemaeus", kind: "Crater", lat: -9.16, lon: -1.84, size: 154, tier: 2,
    named: "1651, Giovanni Battista Riccioli",
    origin: "Claudius Ptolemy, whose Almagest shaped astronomy for 1,400 years. Riccioli titled his own book the Almagestum Novum, the New Almagest.",
    science: "This ancient walled plain is older than the Imbrium basin. Its smooth floor is covered by light plains material from the Imbrium era rather than dark basalt. Neighboring Alphonsus has dark-halo craters, small volcanic vents that sprayed dark ash.",
    story: "In 1958 Nikolai Kozyrev reported a spectrum of a glow in Alphonsus, one of the most cited claims of activity on the Moon. In 1965 Ranger 9 crashed into Alphonsus while US television networks broadcast its final pictures live." },
  { name: "Archimedes", kind: "Crater", lat: 29.72, lon: -3.99, size: 81, tier: 2,
    named: "1651, Giovanni Battista Riccioli",
    origin: "Archimedes of Syracuse, the Greek mathematician and engineer.",
    science: "Archimedes is a timing clue. It sits inside the Imbrium basin, so it formed after that impact, but its floor and ejecta are flooded by mare lava, so it formed before the basin filled. That shows a gap between basin formation and lava flooding.",
    story: "In September 1959 the Soviet probe Luna 2 struck the plain east of Archimedes, the first human-made object to reach the Moon." },
  { name: "Schickard", kind: "Crater", lat: -44.38, lon: -55.11, size: 212, tier: 2,
    named: "1651, Giovanni Battista Riccioli",
    origin: "Wilhelm Schickard (1592–1635), a German professor who built a calculating clock in 1623, one of the earliest mechanical calculators.",
    science: "This large, eroded crater near the southwest limb has a patchy floor of dark basalt and pale highland debris. Its neighbor Wargentin is a rarity: lava filled it to the brim, leaving a raised plateau instead of a bowl.",
    story: "Because it sits near the limb, Schickard is foreshortened into a long oval from Earth. It is a good example of how hard the edges of the near side were to map before spacecraft." },
  { name: "Gassendi", kind: "Crater", lat: -17.55, lon: -39.96, size: 111, tier: 2,
    named: "1651, Giovanni Battista Riccioli",
    origin: "Pierre Gassendi (1592–1655), who in 1631 became the first person to observe a transit of Mercury, as Kepler had predicted.",
    science: "Gassendi is a floor-fractured crater. Magma rising beneath it pushed the floor upward and cracked it into a network of rilles without erupting at the surface. It sits on the northern rim of the Mare Humorum basin.",
    story: "Its geology made it a candidate landing site during Apollo planning." },
  { name: "Mare Nectaris", alt: "Sea of Nectar", kind: "Mare", lat: -15.19, lon: 34.6, size: 339, tier: 2,
    named: "1651, Giovanni Battista Riccioli",
    origin: "Latin for Sea of Nectar.",
    science: "The impact that formed the Nectaris basin is a time marker for the whole Moon: geologists start the Nectarian period with it. Its exact age is still debated, somewhere between about 3.9 and 4.2 billion years, depending on how Apollo 16 samples are interpreted. Like other maria, it has a mascon.",
    story: "The crater trio Theophilus, Cyrillus and Catharina lines its western shore, and the young crater Theophilus cuts into the older Cyrillus." },
  { name: "Sinus Iridum", alt: "Bay of Rainbows", kind: "Bay", lat: 45.01, lon: -31.67, size: 249, tier: 2,
    named: "1651, Giovanni Battista Riccioli",
    origin: "Latin for Bay of Rainbows.",
    science: "The bay is a large crater whose seaward rim was buried by Imbrium lavas, leaving a semicircle of mountains, the Montes Jura. The Yutu rover's ground-penetrating radar, operating nearby in Mare Imbrium, found several stacked layers of lava under the surface.",
    story: "A few days after first quarter the Montes Jura catch sunlight while the bay floor is still dark, so a bright arc appears. Observers call it the Golden Handle. China's Chang'e 3 landed in neighboring Mare Imbrium in 2013." },
  { name: "Montes Apenninus", alt: "Lunar Apennines", kind: "Mountain range", lat: 19.87, lon: 0.03, size: 600, linear: true, tier: 2,
    named: "1647, Johannes Hevelius, in his Selenographia",
    origin: "Hevelius named lunar mountain ranges after ranges on Earth. Most of his other names were dropped, but the mountains kept theirs.",
    science: "These peaks, rising up to about 5 km, are part of the rim of the Imbrium basin, crust thrust up by the impact. At their foot, Apollo 15 collected the Genesis Rock, a piece of anorthosite roughly 4 billion years old. Anorthosite formed when the young Moon's global magma ocean crystallized and light plagioclase crystals floated to the top.",
    story: "Apollo 15 landed beside Mons Hadley, one of the range's peaks, in July 1971." },
  { name: "Tranquility Base", alt: "Statio Tranquillitatis", kind: "Landing site", lat: 0.674, lon: 23.473, size: 0, site: true, tier: 2,
    named: "July 20, 1969, by Neil Armstrong. The IAU made Statio Tranquillitatis official in 1970.",
    origin: "Armstrong's first words after touchdown used the call sign Tranquility Base, the name of the Apollo 11 landing site in the Sea of Tranquility.",
    science: "Apollo 11 left a laser retroreflector that observatories still bounce lasers off. Timing the light's round trip shows the Moon is moving away from Earth by about 3.8 cm per year, because Earth's tides transfer angular momentum to the Moon's orbit.",
    story: "The lunar module Eagle landed several kilometers past its target after Armstrong flew it by hand over a boulder field, with well under a minute of fuel to spare. Three small craters nearby are named Armstrong, Aldrin and Collins." },
  { name: "Proclus", kind: "Crater", lat: 16.09, lon: 46.89, size: 27, tier: 2,
    named: "1651, Giovanni Battista Riccioli",
    origin: "Proclus, a 5th-century Greek philosopher who led Plato's Academy in Athens.",
    science: "Proclus is small but among the brightest craters on the Moon. Its rays fan out unevenly and leave a wedge-shaped zone with no rays at all. Lab experiments show this pattern forms when an impactor strikes at a shallow, grazing angle.",
    story: "Its rays streak across the neighboring Palus Somnium, the Marsh of Sleep, on the western edge of Mare Crisium." },
  { name: "Mare Orientale", alt: "Eastern Sea", kind: "Mare", lat: -19.87, lon: -94.67, size: 294, tier: 3,
    named: "1906, Julius Franz, in his book Der Mond. The name was revived in Kuiper's lunar atlas of 1960.",
    origin: "Franz named it when east and west on the Moon were given as seen in Earth's sky, so this limb was east. In 1961 the IAU switched to the convention an astronaut on the surface would use, so the Eastern Sea now lies on the western limb.",
    science: "Orientale is the best-preserved large multi-ring basin on the Moon. Its rings of mountains, the outer one about 930 km across, have barely been buried by lava. In 1967 Lunar Orbiter 4 revealed it as a giant bullseye. In 2016 GRAIL's gravity maps helped show how the rings formed as the crust collapsed after the impact.",
    story: "From Earth it is only a sliver at the limb, so its full shape was unknown until spacecraft photographed it." },
  { name: "Hadley–Apennine", alt: "Apollo 15 landing site", kind: "Landing site", lat: 26.13, lon: 3.63, size: 0, site: true, tier: 3,
    named: "Named for neighboring Mons Hadley and the Apennine mountains",
    origin: "Mons Hadley honors John Hadley (1682–1744), the English mathematician who invented the reflecting octant used for navigation at sea.",
    science: "Hadley Rille, which the crew drove along, is a sinuous channel about 1.2 km wide and around 300 m deep, carved by flowing lava or formed by a collapsed lava tube. The site was chosen to sample both mare basalt and ancient mountain crust in a single mission.",
    story: "Dave Scott and Jim Irwin landed in July 1971 and drove the first Lunar Roving Vehicle. On live TV, Scott dropped a hammer and a falcon feather together. With no air resistance, they hit the ground at the same moment, as Galileo predicted. The crew also left Fallen Astronaut, a small aluminum figure with a plaque naming 14 astronauts and cosmonauts who had died." },
  { name: "Fra Mauro", kind: "Crater", lat: -6.06, lon: -16.97, size: 97, tier: 3,
    named: "Standardized in the first official IAU lunar nomenclature, 1935",
    origin: "Fra Mauro, a 15th-century Venetian monk whose map of the world, completed around 1450, was one of the most detailed of its time.",
    science: "The hilly Fra Mauro Formation around the crater is thought to be debris thrown out by the Imbrium impact, so samples here help date that event. In 2019 researchers reported that one Apollo 14 rock, Big Bertha, contains a fragment whose chemistry suggests it crystallized on Earth about 4 billion years ago and was blasted to the Moon.",
    story: "Apollo 13 was headed here when its oxygen tank exploded. Apollo 14 landed instead in February 1971, and Alan Shepard hit two golf balls with a makeshift club." },
  { name: "Vallis Alpes", alt: "Alpine Valley", kind: "Valley", lat: 49.21, lon: 3.63, size: 155, linear: true, tier: 3,
    named: "Discovery usually credited to Francesco Bianchini, 1727",
    origin: "The valley cuts through the Montes Alpes, which Hevelius named after the Alps.",
    science: "The valley is about 155 km long and up to 10 km wide. It is a graben, a strip of crust that dropped down between parallel faults, linked to stresses from the Imbrium basin. A thin, winding lava rille runs along its floor.",
    story: "The floor rille is narrow enough to challenge good amateur telescopes, so seeing it is a point of pride among lunar observers." },
  { name: "Rupes Recta", alt: "The Straight Wall", kind: "Fault scarp", lat: -21.67, lon: -7.7, size: 116, linear: true, tier: 3,
    named: "Latin name standardized by the IAU. Observers have long called it the Straight Wall.",
    origin: "Rupes Recta means straight cliff.",
    science: "It is a normal fault: the crust was stretched and the ground on one side dropped by a few hundred meters. The weight of mare lava filling the basin probably caused the stretching. Despite its appearance, the slope is gentle, only around 7 degrees.",
    story: "Before local noon its shadow draws a dark line across Mare Nubium. After noon the slope faces the Sun and shows as a bright line." },
  { name: "Reiner Gamma", kind: "Lunar swirl", lat: 7.39, lon: -58.96, size: 73, tier: 3,
    named: "Takes its name from the nearby crater Reiner",
    origin: "Reiner honors Vincenzo Reinieri, a student of Galileo. The Greek letter marks a feature associated with that crater.",
    science: "Reiner Gamma has no relief. It is a bright, tadpole-shaped swirl on the dark mare, and it lines up with a strong patch of magnetized crust. One leading idea is that this mini-magnetosphere deflects the solar wind, so the soil stays bright instead of weathering dark. Another is that electrically charged dust collects there. NASA's Lunar Vertex mission was selected to measure it from the surface.",
    story: "Similar swirls appear elsewhere on the Moon, often opposite large impact basins, which hints at how the magnetic anomalies formed." },
  { name: "Tsiolkovskiy", kind: "Crater", lat: -20.38, lon: 128.97, size: 184, far: true, tier: 3,
    named: "1961, IAU, after the Soviet Luna 3 photographs of 1959",
    origin: "Konstantin Tsiolkovsky (1857–1935), a Russian schoolteacher who derived the rocket equation in 1903.",
    science: "Its dark lava floor and bright central peak stand out against the pale far-side highlands. The far side has few maria because its crust is much thicker, so magma rarely reached the surface. Tsiolkovskiy was deep enough for lava to break through.",
    story: "It was one of the few features recognizable in Luna 3's grainy first images of the far side." },
  { name: "Mare Moscoviense", alt: "Sea of Muscovy", kind: "Mare", lat: 27.28, lon: 148.12, size: 276, far: true, tier: 3,
    named: "Proposed by Soviet scientists after Luna 3 in 1959. Accepted by the IAU in 1961.",
    origin: "Lunar seas are traditionally named for weather and states of mind, so a sea named for a place broke the pattern.",
    science: "GRAIL's gravity maps show the crust beneath Moscoviense is among the thinnest on the Moon, which helps explain why lava reached the surface here on the thick-crusted far side. Its rings are oddly off-center, which has led some researchers to propose that two impacts overlapped.",
    story: "It is one of the few maria on the far side. It appeared as a dark smudge in the first images Luna 3 sent back in October 1959." },
  { name: "Korolev", kind: "Basin", lat: -4.19, lon: -157.41, size: 423, far: true, tier: 3,
    named: "1970, IAU",
    origin: "Sergei Korolev (1907–1966), chief designer of the rockets behind Sputnik and Yuri Gagarin's flight. His identity was a Soviet state secret until his death.",
    science: "Korolev is a peak-ring basin: the impact was large enough that instead of a single central peak, the rebounding crust formed an inner ring of mountains.",
    story: "A crater on Mars also carries Korolev's name. That crater is filled with water ice." },
  { name: "Apollo", kind: "Basin", lat: -35.69, lon: -151.48, size: 524, far: true, tier: 3,
    named: "1970, IAU",
    origin: "Named for the Apollo program, which landed twelve people on the Moon between 1969 and 1972.",
    science: "Apollo is a double-ring basin inside the even larger South Pole–Aitken basin, so its craters dig into deep crust. In June 2024 China's Chang'e 6 landed in southern Apollo and returned about 1.9 kg of soil and rock, the first samples ever brought back from the far side.",
    story: "Craters inside the basin are named for the seven Challenger astronauts, adopted soon after the 1986 accident, and the seven Columbia astronauts, approved in 2006." },
  { name: "Von Kármán", kind: "Crater", lat: -44.45, lon: 176.25, size: 186, far: true, tier: 3,
    named: "1970, IAU",
    origin: "Theodore von Kármán (1881–1963), the Hungarian-American aerospace engineer who co-founded NASA's Jet Propulsion Laboratory.",
    science: "Von Kármán lies within South Pole–Aitken, the largest and oldest well-preserved impact basin on the Moon, about 2,500 km across. Spectra from the Yutu-2 rover showed olivine and low-calcium pyroxene. The team suggested these minerals may come from the lunar mantle, dug up by the nearby Finsen impact. That interpretation is still being tested.",
    story: "On January 3, 2019, China's Chang'e 4 made the first soft landing on the far side here. The Moon blocks direct radio contact with Earth, so the mission relayed signals through the Queqiao satellite beyond the Moon." },
  { name: "Daedalus", kind: "Crater", lat: -5.83, lon: 179.4, size: 94, far: true, tier: 3,
    named: "1970, IAU",
    origin: "Daedalus, the craftsman of Greek myth who built wings of feathers and wax for himself and his son Icarus.",
    science: "Daedalus sits almost at the center of the far side, where the bulk of the Moon blocks radio noise from Earth. That makes it one of the quietest radio environments in the inner solar system and a proposed site for a radio telescope that could hear the faint signals of the early universe.",
    story: "The Apollo 11 crew photographed Daedalus from orbit, and the image became one of the classic portraits of a lunar crater." },
  { name: "Shackleton", kind: "Crater", lat: -89.67, lon: 129.78, size: 21, polar: true, tier: 3,
    named: "1994, IAU",
    origin: "Ernest Shackleton (1874–1922), the Antarctic explorer.",
    science: "Shackleton sits almost on the south pole and is about 4 km deep. The Moon's spin axis is tilted only about 1.5 degrees, so sunlight here always arrives nearly sideways. The rim is lit for much of the year, while the floor stays in permanent shadow at temperatures cold enough to trap ice. In 2009 the LCROSS impactor struck nearby Cabeus crater and measured a few percent water by mass in the debris.",
    story: "The ridges and rims around Shackleton are among the candidate landing regions for NASA's Artemis program, chosen for near-constant sunlight beside permanently shadowed ice." }
];

    science: "Deneb, the swan's tail, is one of the most luminous stars visible to the eye, tens of thousands of times brighter than the Sun. Its distance is uncertain, usually given as 1,500 to 2,600 light-years. Cygnus X-1, discovered in 1964, was the first X-ray source widely accepted as a black hole. NASA's Kepler telescope stared at a patch of Cygnus and Lyra from 2009 to 2013 and found thousands of exoplanets.",
    story: "Deneb, Vega and Altair form the Summer Triangle. Albireo, the swan's head, is a colorful gold-and-blue double star in small telescopes." },
  { id: "Lyr", name: "Lyra", meaning: "The Lyre", tier: 1,
    names: [
      ["Greek", "Lýra", "The lyre of Orpheus."],
      ["Chinese", "Zhīnǚ 织女", "The Weaver Girl, the star Vega. She meets the Cowherd (Altair) across the Milky Way once a year at the Qixi festival."],
      ["Japanese", "Orihime", "The weaving princess (Vega) of Tanabata, the Japanese form of the same legend."],
      ["Arabic", "al-Nasr al-Wāqiʿ", "The Swooping Eagle, the source of the name Vega."]
    ],
    science: "Vega, 25 light-years away, served as the zero point of the stellar magnitude scale. In 1850 it became the first star other than the Sun to be photographed. In 1872 Henry Draper photographed its spectrum, another first for a star beyond the Sun. It spins so fast that its equator bulges. Epsilon Lyrae is the Double Double, two pairs of stars. The Ring Nebula (M57) is the glowing shell of gas thrown off by a dying Sun-like star.",
    story: "Because of precession, Vega was the pole star about 14,000 years ago and will be again around the year 13,700." },
  { id: "Sco", name: "Scorpius", meaning: "The Scorpion", tier: 1, zodiac: true,
    names: [
      ["Babylonian", "GIR.TAB", "The Scorpion. The figure goes back at least to Mesopotamian star lists."],
      ["Māori", "Te Matau a Māui", "The fishhook of Māui, used to haul up the North Island. Antares (Rehua) is the bait."],
      ["Hawaiian", "Ka Makau Nui o Māui", "Māui's great fishhook."],
      ["Chinese", "Xīn 心", "The Heart (Antares), the heart of the Azure Dragon of the East."]
    ],
    science: "Antares is a red supergiant about 550 light-years away. Its name means rival of Ares (Mars), because the two can look alike in color. Many of Scorpius's bright stars belong to a young stellar association, the nearest region of recent massive-star birth. Scorpius X-1, found in 1962, was the first X-ray source discovered outside the solar system. M4, about 6,000 light-years away, is one of the closest globular clusters.",
    story: "In Greek myth this is the scorpion that killed Orion. The two were placed on opposite sides of the sky." },
  { id: "Leo", name: "Leo", meaning: "The Lion", tier: 1, zodiac: true,
    names: [
      ["Babylonian", "UR.GU.LA", "The Great Lion."],
      ["Hindu", "Simha", "The Lion, the zodiac sign."],
      ["Chinese", "Xuānyuán 轩辕", "The Yellow Emperor, a long chain of stars that includes Regulus."],
      ["Arabic", "al-Asad", "The Lion."]
    ],
    science: "Regulus, about 79 light-years away, spins so fast, once every 16 hours or so, that it is noticeably flattened. It lies almost exactly on the ecliptic, so the Moon often passes in front of it. The Leonid meteors, debris from Comet Tempel–Tuttle, produced a famous storm in 1833 that helped prompt the scientific study of meteors. The Leo Triplet is a group of three spiral galaxies about 35 million light-years away.",
    story: "The Greeks identified it with the Nemean lion killed by Heracles as the first of his twelve labors." },
  { id: "Tau", name: "Taurus", meaning: "The Bull", tier: 1, zodiac: true,
    names: [
      ["Babylonian", "GU4.AN.NA", "The Bull of Heaven, the creature Gilgamesh and Enkidu slay in the epic."],
      ["Japanese", "Subaru", "The Pleiades, the 'gathered' stars. The car company's logo shows them."],
      ["Māori", "Matariki", "The Pleiades. Their dawn rising marks the Māori new year, a national holiday in Aotearoa New Zealand since 2022."],
      ["Hindu", "Krittika / Rohini", "Krittika is the Pleiades. Rohini, the red one, is Aldebaran. Both are lunar mansions."],
      ["Arabic", "al-Thurayyā / al-Dabarān", "The Pleiades, and Aldebaran, the Follower, which trails them across the sky."]
    ],
    science: "Aldebaran, the bull's eye, is an orange giant about 65 light-years away. It sits in front of the V-shaped Hyades cluster, about 150 light-years away, and is not a member of it. The Pleiades are a young cluster about 440 light-years away. The Crab Nebula (M1) is the debris of a supernova recorded by Chinese astronomers in 1054. At its heart is a pulsar spinning 30 times a second.",
    story: "Many cultures tell of the Pleiades as a group of sisters, and many count only six visible stars and explain a missing seventh." },
  { id: "Gem", name: "Gemini", meaning: "The Twins", tier: 1, zodiac: true,
    names: [
      ["Babylonian", "MAŠ.TAB.BA.GAL.GAL", "The Great Twins."],
      ["Hindu", "Mithuna / Punarvasu", "Mithuna is the zodiac sign. Punarvasu is the lunar mansion of Castor and Pollux."],
      ["Chinese", "Jǐng 井", "The Well, one of the 28 lunar mansions."],
      ["Arabic", "al-Tawʾamān", "The Twins."]
    ],
    science: "Castor looks like one star but is a system of six: three pairs of stars about 51 light-years away. Pollux, an orange giant 34 light-years away, has a confirmed planet. William Herschel found Uranus near the feet of the twins in 1781, and Clyde Tombaugh discovered Pluto in Gemini in 1930. The Geminid meteors in December come from the rocky asteroid 3200 Phaethon rather than a comet.",
    story: "Castor and Pollux were the twin brothers of Helen of Troy and the patrons of sailors." },
  { id: "Cru", name: "Crux", meaning: "The Southern Cross", tier: 1,
    names: [
      ["Māori", "Māhutonga / Te Punga", "Te Punga is the anchor of the great canoe of Tamarēreti, the Milky Way."],
      ["Aboriginal Australian", "Head of the Emu in the Sky", "For many groups, the dark Coalsack next to the Cross is the head of an emu whose neck and body are dark dust lanes in the Milky Way."],
      ["Boorong", "Bunya", "A ring-tail possum, the top star of the Cross. The dark Coalsack beside it was Tchingal, the emu."],
      ["Greek", "Part of Centaurus", "Ptolemy listed these stars as the centaur's hind legs. European navigators made the Cross a separate figure in the 1500s."]
    ],
    science: "Crux is the smallest of the 88 constellations, about 68 square degrees. Acrux, its brightest star, is a multiple-star system about 320 light-years away. The Jewel Box (NGC 4755) is a young open cluster about 6,400 light-years away. The Coalsack, about 600 light-years away, is a dark nebula of dust blocking the light of the Milky Way behind it.",
    story: "The Cross appears on the flags of Australia, New Zealand, Brazil, Samoa and Papua New Guinea. Its long axis points roughly toward the south celestial pole." },
  { id: "Sgr", name: "Sagittarius", meaning: "The Archer", tier: 1, zodiac: true,
    names: [
      ["English", "The Teapot", "The modern asterism of its brightest stars."],
      ["Babylonian", "Pabilsag", "A Mesopotamian archer god, drawn as a winged centaur."],
      ["Chinese", "Dǒu 斗", "The Southern Dipper, one of the 28 lunar mansions."],
      ["Hindu", "Dhanu", "The Bow, the zodiac sign."]
    ],
    science: "The center of the Milky Way lies in Sagittarius, about 26,000 light-years away. At the center is Sagittarius A*, a black hole of about 4 million solar masses. Tracking stars orbiting it earned the 2020 Nobel Prize in Physics, and the Event Horizon Telescope imaged its shadow in 2022. The Lagoon (M8) and Trifid (M20) nebulae are bright star-forming regions in this direction.",
    story: "The 'steam' rising from the Teapot's spout is the brightest part of the Milky Way." },
  { id: "Aql", name: "Aquila", meaning: "The Eagle", tier: 2,
    names: [
      ["Chinese", "Niúláng 牛郎", "The Cowherd, the star Altair, who is separated from the Weaver Girl (Vega) by the Milky Way."],
      ["Japanese", "Hikoboshi", "The cowherd of the Tanabata festival."],
      ["Arabic", "al-Nasr al-Ṭāʾir", "The Flying Eagle, the source of the name Altair."],
      ["Hindu", "Shravana", "The lunar mansion marked by Altair."]
    ],
    science: "Altair, just under 17 light-years away, rotates in about 9 hours, so it is visibly squashed. In 2007 it became the first ordinary main-sequence star other than the Sun to have its surface imaged, using the CHARA interferometer. Its poles are measurably hotter than its equator.",
    story: "In Greek myth the eagle carried Zeus's thunderbolts and carried off Ganymede to be cupbearer to the gods." },
  { id: "CMa", name: "Canis Major", meaning: "The Great Dog", tier: 2,
    names: [
      ["Ancient Egypt", "Sopdet (Sothis)", "Sirius, whose first dawn appearance after months hidden in sunlight signaled the coming Nile flood and the new year."],
      ["Chinese", "Tiānláng 天狼", "The Celestial Wolf (Sirius)."],
      ["Greek", "Seirios", "The Scorching One. Its dawn rising in summer gave us the 'dog days'."],
      ["Arabic", "al-Shiʿrā", "The ancestor of the name Sirius in many languages."]
    ],
    science: "Sirius, 8.6 light-years away, is the brightest star in the night sky. In 1844 Friedrich Bessel noticed it wobbling and predicted an unseen companion. Alvan Graham Clark spotted Sirius B in 1862. It turned out to be a white dwarf, roughly Earth-sized but about as massive as the Sun, one of the first such stars known.",
    story: "Canis Major is one of Orion's hunting dogs. Orion's belt points down and to the left toward Sirius." },
  { id: "Peg", name: "Pegasus", meaning: "The Winged Horse", tier: 2,
    names: [
      ["Babylonian", "AŠ.IKU", "The Field, the Great Square of Pegasus."],
      ["Chinese", "Shì 室 and Bì 壁", "The Encampment and the Wall, two lunar mansions formed from the Great Square."],
      ["Arabic", "al-Faras al-Aʿẓam", "The Greater Horse."]
    ],
    science: "In 1995 Michel Mayor and Didier Queloz discovered 51 Pegasi b, the first planet found orbiting a Sun-like star. It is a 'hot Jupiter' that circles its star every 4.2 days, and the discovery earned the 2019 Nobel Prize in Physics. The Great Square shares its northeast corner star, Alpheratz, with Andromeda.",
    story: "Pegasus sprang from the neck of Medusa when Perseus beheaded her." },
  { id: "And", name: "Andromeda", meaning: "The Chained Princess", tier: 2,
    names: [
      ["Greek", "Andromédē", "The princess chained to a rock as a sacrifice to a sea monster."],
      ["Arabic", "al-Marʾa al-Musalsala", "The Chained Woman."],
      ["Chinese", "Kuí 奎", "The Legs, a lunar mansion spanning Andromeda and Pisces."]
    ],
    science: "The Andromeda Galaxy (M31), about 2.5 million light-years away, is the most distant object easily seen with the naked eye. The Persian astronomer al-Ṣūfī recorded it as a 'little cloud' in 964. In the 1920s Edwin Hubble measured Cepheid variable stars in it and showed it is a separate galaxy far outside the Milky Way. A collision with the Milky Way was long predicted for about 4.5 billion years from now, but a 2025 study of 100,000 simulations put the chance of a merger within 10 billion years at only about 50 percent.",
    story: "Perseus rescued Andromeda from the sea monster, and the whole family, Cepheus, Cassiopeia, Andromeda and Perseus, share this part of the sky." },
  { id: "Per", name: "Perseus", meaning: "The Hero", tier: 2,
    names: [
      ["Greek", "Perseús", "The hero who killed Medusa."],
      ["Arabic", "Raʾs al-Ghūl", "The Demon's Head, the star Algol, seen as the Gorgon's head in the hero's hand."],
      ["Chinese", "Dàlíng 大陵", "The Great Mausoleum, which includes Algol."]
    ],
    science: "Algol is an eclipsing binary: every 2.87 days the dimmer star passes in front of the brighter one and Algol fades for a few hours. In 1783 John Goodricke, a deaf amateur astronomer, proposed the eclipse explanation. The Perseid meteors each August are dust from Comet Swift–Tuttle. The Double Cluster is a pair of young star clusters about 7,500 light-years away.",
    story: "Algol's regular winking may be why so many cultures associated it with demons or evil." },
  { id: "Boo", name: "Boötes", meaning: "The Herdsman", tier: 2,
    names: [
      ["Greek", "Arktouros", "Bear Guardian (Arcturus), the star that follows the Great Bear."],
      ["Hawaiian", "Hōkūleʻa", "The Star of Gladness (Arcturus), a zenith star that passes overhead in Hawaiʻi. Navigators used it to find home, and the voyaging canoe Hōkūleʻa is named for it."],
      ["Chinese", "Dàjiǎo 大角", "The Great Horn (Arcturus), a horn of the Azure Dragon."],
      ["Mi'kmaq", "Four of the bird hunters", "Pigeon, Blue Jay and two owls continue the chase of the bear Muin."]
    ],
    science: "Arcturus is an orange giant 37 light-years away and the brightest star in the northern celestial hemisphere. It moves unusually fast across the sky and may belong to a stream of stars captured from a smaller galaxy. Boötes also contains the Boötes Void, a region about 330 million light-years across with very few galaxies.",
    story: "The 1933 Chicago World's Fair opened with light from Arcturus: observatory telescopes focused it onto photocells that switched on the fairground lights. The star was chosen because its light was then thought to have left Arcturus around the time of the city's previous fair, in 1893." },
  { id: "Vir", name: "Virgo", meaning: "The Maiden", tier: 2, zodiac: true,
    names: [
      ["Babylonian", "AB.SIN", "The Furrow. Spica was an ear of grain held by the goddess Shala."],
      ["Hindu", "Kanya / Chitra", "Kanya, the Maiden, is the zodiac sign. Chitra, the bright one, is Spica."],
      ["Chinese", "Jiǎo 角", "The Horn, the first lunar mansion, marked by Spica."]
    ],
    science: "Virgo is the second-largest constellation. Spica is a close pair of hot blue stars about 250 light-years away whose gravity distorts each other's shapes. Beyond it lies the Virgo Cluster, more than a thousand galaxies about 54 million light-years away. Its giant galaxy M87 hosts the black hole that in 2019 became the first ever imaged.",
    story: "Hipparchus may have discovered precession around 130 BC by comparing his measurements of Spica with older records." },
  { id: "Aur", name: "Auriga", meaning: "The Charioteer", tier: 2,
    names: [
      ["Babylonian", "GAM", "The Crook or Scimitar."],
      ["Chinese", "Wǔchē 五车", "The Five Chariots."],
      ["Hindu", "Brahmahridaya", "The Heart of Brahma (Capella)."],
      ["Latin", "Capella", "The Little She-Goat, carried by the charioteer with her kids nearby."]
    ],
    science: "Capella, 43 light-years away, is actually two yellow giant stars orbiting each other every 104 days. Epsilon Aurigae is an eclipsing binary with a 27-year period. Each eclipse lasts nearly two years because a huge dark disk around one star passes in front of the other.",
    story: "The Greeks linked Auriga with Erichthonius, a legendary king of Athens credited with inventing the four-horse chariot." },
  { id: "Cen", name: "Centaurus", meaning: "The Centaur", tier: 2,
    names: [
      ["Greek", "Kentauros", "Often identified with Chiron, the wise centaur."],
      ["Boorong", "Berm-berm-gle", "Two red-kneed dotterels (Alpha and Beta Centauri), recorded from the Boorong of northwestern Victoria in 1857."],
      ["Chinese", "Nánmén 南门", "The Southern Gate (Alpha Centauri)."],
      ["Arabic", "Rijl al-Qanṭūris", "The Foot of the Centaur, the origin of the name Rigil Kentaurus."]
    ],
    science: "Alpha Centauri is the nearest star system, 4.37 light-years away. Its dim red companion Proxima, 4.24 light-years away, has at least one Earth-mass planet in its habitable zone, found in 2016. Omega Centauri, with millions of stars, is the largest globular cluster in the Milky Way and may be the stripped core of a small galaxy we absorbed. Centaurus A is a nearby radio galaxy with jets driven by a supermassive black hole.",
    story: "Alpha and Beta Centauri are the Pointers. They lead the eye to the Southern Cross." },
  { id: "Car", name: "Carina", meaning: "The Keel", tier: 2,
    names: [
      ["Greek", "Argo Navis (part)", "The ship of Jason and the Argonauts. Lacaille split it into Carina, Puppis and Vela in the 1750s."],
      ["Chinese", "Nánjí Lǎorén 南极老人", "The Old Man of the South Pole (Canopus), the star of longevity, Shòuxīng."],
      ["Hindu", "Agastya", "The sage Agastya (Canopus)."],
      ["Arabic", "Suhayl", "Canopus, a famous southern star in Arabic poetry and navigation."],
      ["Boorong", "War", "The crow (Canopus). The Boorong also recorded Eta Carinae's great outburst in their sky lore."]
    ],
    science: "Canopus, the second-brightest star in the night sky, is a giant about 310 light-years away. Spacecraft have long used it as a guide star for orientation. Eta Carinae, about 7,500 light-years away, is a pair of very massive stars. In the 1840s it erupted and briefly became one of the brightest stars in the sky. It is wrapped in the Carina Nebula, one of the largest star-forming regions in our galaxy.",
    story: "Old star catalogs list Carina's stars under the giant constellation Argo, so its stars' Greek letters skip around." },
  { id: "CrB", name: "Corona Borealis", meaning: "The Northern Crown", tier: 2,
    names: [
      ["Greek", "Stéphanos", "The crown Dionysus gave to Ariadne."],
      ["Arabic", "al-Fakkah", "The Broken (or Separated) Ring. Its brightest star Alphecca is 'the bright one of al-Fakkah'."],
      ["Chinese", "Guànsuǒ 贯索", "The Coiled Thong, a cord for stringing coins and also read as a prison."],
      ["Shawnee", "The Celestial Sisters", "Star maidens who came down to dance. One became the wife of the hunter White Hawk."]
    ],
    science: "T Coronae Borealis is a recurrent nova. A white dwarf pulls gas from a red giant companion until it ignites in a thermonuclear flash. It brightened to naked-eye visibility in 1866 and 1946, and signs of another outburst made it a watched star in the 2020s.",
    story: "The semicircle of seven stars is small but distinctive, sitting between Arcturus and Vega." },
  { id: "Dra", name: "Draco", meaning: "The Dragon", tier: 2,
    names: [
      ["Greek", "Drákōn", "Ladon, the dragon guarding the golden apples of the Hesperides."],
      ["Arabic", "al-ʿAwāʾidh", "The Mother Camels, four stars of the dragon's head."],
      ["Chinese", "Zǐwēi walls 紫微", "Its stars form part of the walls of the Purple Forbidden Enclosure around the pole."]
    ],
    science: "Thuban was the pole star around 2800 BC, when it lay just 0.1° from the pole, closer than Polaris is today. Precession has since carried the pole toward Polaris. The Cat's Eye Nebula (NGC 6543) is a planetary nebula with intricate shells of gas thrown off by a dying star. The Draconid meteors come from Comet Giacobini–Zinner.",
    story: "Draco winds between the two bears, fitting for a dragon that guards the pole." },
  { id: "Her", name: "Hercules", meaning: "The Hero", tier: 2,
    names: [
      ["Greek (early)", "Engónasin", "The Kneeler, a figure Aratus could not identify."],
      ["Greek", "Hēraklês", "Later identified with the hero of the twelve labors."],
      ["Chinese", "Tiānshì 天市", "Its stars help form the walls of the Heavenly Market Enclosure."]
    ],
    science: "M13, the Great Globular Cluster, holds several hundred thousand stars about 22,000 light-years away. In 1974 the Arecibo radio telescope beamed a coded message toward it. It will take roughly 25,000 years to arrive. The Sun's motion through the galaxy is carrying the solar system toward a point near Hercules and Lyra, the solar apex.",
    story: "Hercules appears upside down in Greek star maps, kneeling with one foot on Draco's head." },
  { id: "Cnc", name: "Cancer", meaning: "The Crab", tier: 2, zodiac: true,
    names: [
      ["Babylonian", "AL.LUL", "The Crab."],
      ["Chinese", "Guǐ 鬼 / Jīshī 积尸", "The Ghost mansion. The Beehive cluster is Jishi, the Piled-up Corpses."],
      ["Hindu", "Karka / Pushya", "Karka, the Crab, is the zodiac sign. Pushya, the Nourisher, is a lunar mansion."]
    ],
    science: "The Beehive Cluster (M44), about 600 light-years away, is a naked-eye haze of hundreds of stars, and Galileo was the first to resolve it into individual stars. The star 55 Cancri hosts five known planets. The Tropic of Cancer is named because the Sun was in Cancer at the June solstice about 2,000 years ago. Because of precession, it is now on the Taurus–Gemini border.",
    story: "In Greek myth, Hera sent the crab to distract Heracles as he fought the Hydra, and it was crushed underfoot." },
  { id: "Ari", name: "Aries", meaning: "The Ram", tier: 2, zodiac: true,
    names: [
      ["Babylonian", "LÚ.ḪUN.GÁ", "The Hired Man, a farm laborer, the last constellation of the agricultural year."],
      ["Hindu", "Mesha / Ashvini", "Mesha, the Ram, is the zodiac sign. Ashvini, the horse-headed twins, is the first lunar mansion."],
      ["Chinese", "Lóu 娄", "The Bond, one of the 28 lunar mansions."]
    ],
    science: "About 2,000 years ago the Sun crossed the celestial equator in Aries at the March equinox, which is why that point is still called the First Point of Aries. Precession has since moved it into Pisces. Hamal, the brightest star, is an orange giant about 66 light-years away.",
    story: "The Greeks saw the ram with the Golden Fleece sought by Jason and the Argonauts." },
  { id: "Cap", name: "Capricornus", meaning: "The Sea-Goat", tier: 2, zodiac: true,
    names: [
      ["Babylonian", "SUḪUR.MAŠ", "The Goat-Fish, a symbol of the god Ea."],
      ["Hindu", "Makara", "A sea creature, the zodiac sign."],
      ["Chinese", "Niú 牛", "The Ox, one of the 28 lunar mansions."]
    ],
    science: "The Tropic of Capricorn takes its name from when the Sun stood in Capricornus at the December solstice about 2,000 years ago. Because of precession, it is now in Sagittarius. Alpha Capricorni is a naked-eye pair of stars that just happen to line up. One is about 690 light-years away and the other about 100.",
    story: "The goat-fish is one of the oldest figures in the sky, appearing on Babylonian boundary stones." },
  { id: "Aqr", name: "Aquarius", meaning: "The Water-Bearer", tier: 2, zodiac: true,
    names: [
      ["Babylonian", "GU.LA", "The Great One, the god Ea, pouring water from a jar."],
      ["Hindu", "Kumbha", "The Water Pot, the zodiac sign."],
      ["Chinese", "Xū 虚 and Wēi 危", "Emptiness and Rooftop, two of the 28 lunar mansions."]
    ],
    science: "The Helix Nebula, about 650 light-years away, is one of the nearest planetary nebulae. TRAPPIST-1, a cool red dwarf about 40 light-years away in Aquarius, has seven roughly Earth-sized planets, several in its habitable zone. The Eta Aquariid meteors each May are debris from Halley's Comet.",
    story: "This region of faint stars is sometimes called the Sea, as it is crowded with water figures: Pisces, Cetus, Piscis Austrinus, Delphinus and Eridanus." },
  { id: "Lib", name: "Libra", meaning: "The Scales", tier: 2, zodiac: true,
    names: [
      ["Babylonian", "ZI.BA.AN.NA", "The Scales, sometimes the scales of judgment of the sun god Shamash."],
      ["Greek", "Chēlaí", "The Claws of the scorpion. Its stars Zubenelgenubi and Zubeneschamali are Arabic for the southern and northern claw."],
      ["Chinese", "Dǐ 氐", "The Root, one of the 28 lunar mansions."],
      ["Hindu", "Tula", "The Balance, the zodiac sign."]
    ],
    science: "Libra is the only zodiac constellation that is not a living creature. Gliese 581, a red dwarf about 20 light-years away, hosts a well-studied planetary system.",
    story: "Babylonian astronomers already saw scales here, but Greek writers, Ptolemy among them, treated these stars as the scorpion's claws. The balance became established among the Romans in the 1st century BC, possibly because the autumn equinox, when day and night are balanced, once fell here." },
  { id: "Oph", name: "Ophiuchus", meaning: "The Serpent-Bearer", tier: 2,
    names: [
      ["Greek", "Ophioûkhos", "Asclepius, god of medicine, holding a serpent."],
      ["Chinese", "Tiānshì walls 天市", "Its stars help form the Heavenly Market Enclosure."],
      ["Arabic", "al-Ḥawwāʾ", "The Snake Charmer."]
    ],
    science: "The Sun passes through Ophiuchus from late November to mid-December, so it is sometimes called the thirteenth zodiac constellation. In 1604 Kepler observed a supernova here, the last supernova in our galaxy seen with the naked eye. Barnard's Star, about 6 light-years away, moves across the sky faster than any other star.",
    story: "Ophiuchus grips Serpens, which the IAU splits into two pieces, Serpens Caput and Serpens Cauda, on either side of him. It is the only constellation split in two." },
  { id: "Crv", name: "Corvus", meaning: "The Crow", tier: 3,
    names: [
      ["Babylonian", "UGA.MUŠEN", "The Raven, perched on the serpent's tail."],
      ["Chinese", "Zhěn 轸", "The Chariot, one of the 28 lunar mansions."],
      ["Hindu", "Hasta", "The Hand, a lunar mansion."]
    ],
    science: "The Antennae Galaxies (NGC 4038/4039) are two colliding spirals about 45 million light-years away. Long tails of stars flung out by the collision look like insect antennae, and the collision is setting off bursts of star formation.",
    story: "In the Greek tale, Apollo sent the crow for water. It dawdled, lied about the delay and was banished to the sky next to the cup, Crater, which it can never drink from." },
  { id: "Hya", name: "Hydra", meaning: "The Water Snake", tier: 3,
    names: [
      ["Greek", "Hýdra", "The many-headed serpent killed by Heracles."],
      ["Chinese", "Liǔ 柳, Xīng 星, Zhāng 张", "The Willow, the Star and the Extended Net, three of the 28 lunar mansions along its length."],
      ["Hindu", "Ashlesha", "The Entwiner, the lunar mansion of the serpent's head."],
